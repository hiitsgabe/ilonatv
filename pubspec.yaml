name: ilonatv
description: "A home screen launcher for Android TV and Fire TV, with an Apple TV look."
publish_to: 'none'

version: 0.6.1+10002

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6
  ilonatv_protocol:
    path: packages/ilonatv_protocol
  qr: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Inter 4.1 static TTFs (OFL, see assets/fonts/LICENSE.txt).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

  # Console wordmarks for the inputs' cards (see lib/ui/input_brands.dart).
  assets:
    - assets/inputs/
    - assets/brand/
    - assets/setup/
