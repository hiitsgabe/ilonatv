name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  FLUTTER_VERSION: "3.47.2"
  FLUTTER_CHANNEL: "stable"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}

      # All three first: the root analyze also looks into companion/.
      - name: Get dependencies
        run: |
          flutter pub get
          (cd companion && flutter pub get)
          (cd packages/ilonatv_protocol && dart pub get)

      - name: Analyze the TV app
        run: flutter analyze

      - name: Test the TV app
        run: flutter test

      - name: Test the protocol
        working-directory: packages/ilonatv_protocol
        run: dart test

      - name: Analyze the companion
        working-directory: companion
        run: flutter analyze

      - name: Test the companion
        working-directory: companion
        run: flutter test
