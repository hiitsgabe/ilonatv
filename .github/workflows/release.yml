name: Build and Release

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.2"
  FLUTTER_CHANNEL: "stable"

permissions:
  contents: read

# Two runs at once could publish an older release as "latest", which the companion installs.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  resolve-version:
    # workflow_dispatch can run from any branch; only main is bumped and released.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.resolve.outputs.VERSION }}
      version_name: ${{ steps.resolve.outputs.VERSION_NAME }}
      build_number: ${{ steps.resolve.outputs.BUILD_NUMBER }}
    steps:
      # A debug-signed public release could never be updated by a release-signed one.
      - name: Check the signing secrets
        env:
          KEYSTORE64: ${{ secrets.KEYSTORE64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE64" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::KEYSTORE64/KEY_PASSWORD/KEY_ALIAS must be set"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}

      # The gate: a failing check stops the run before a bump commit or tag is pushed.
      - name: Get dependencies
        run: |
          flutter pub get
          (cd companion && flutter pub get)
          (cd packages/ilonatv_protocol && dart pub get)

      - name: Analyze and test the TV app
        run: |
          flutter analyze
          flutter test

      - name: Test the protocol
        working-directory: packages/ilonatv_protocol
        run: dart test

      - name: Analyze and test the companion
        working-directory: companion
        run: |
          flutter analyze
          flutter test

      # One version for both apps: the companion follows the TV app's pubspec.
      - name: Resolve and bump version
        id: resolve
        run: |
          set -euo pipefail
          CURRENT=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          VERSION_NAME=$(echo "$CURRENT" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$CURRENT" | cut -d'+' -f2)

          IFS='.' read -r VMAJOR VMINOR VPATCH <<< "$VERSION_NAME"
          VPATCH=$((VPATCH + 1))
          if [ "$VPATCH" -gt 9 ]; then
            VPATCH=0
            VMINOR=$((VMINOR + 1))
            if [ "$VMINOR" -gt 9 ]; then
              VMINOR=0
              VMAJOR=$((VMAJOR + 1))
            fi
          fi

          NEW_VERSION_NAME="${VMAJOR}.${VMINOR}.${VPATCH}"
          NEW_BUILD_NUMBER=$((BUILD_NUMBER + 1))
          NEW_VERSION="${NEW_VERSION_NAME}+${NEW_BUILD_NUMBER}"
          TAG="v${NEW_VERSION_NAME}"

          sed -i "s/^version: .*/version: ${NEW_VERSION}/" pubspec.yaml companion/pubspec.yaml
          sed -i "s/^const kVersion = .*/const kVersion = '${NEW_VERSION_NAME}';/" lib/app.dart
          grep -q "^const kVersion = '${NEW_VERSION_NAME}';" lib/app.dart
          sed -i "s/^const kVersion = .*/const kVersion = '${NEW_VERSION_NAME}';/" companion/lib/version.dart
          grep -q "^const kVersion = '${NEW_VERSION_NAME}';" companion/lib/version.dart

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add pubspec.yaml companion/pubspec.yaml lib/app.dart companion/lib/version.dart
          git commit -m "chore: bump version to ${NEW_VERSION}"
          git push origin main
          git tag "$TAG"
          git push origin "$TAG"

          echo "VERSION=$TAG" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=$NEW_VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "BUILD_NUMBER=$NEW_BUILD_NUMBER" >> "$GITHUB_OUTPUT"

  build-android:
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      # The tag, not github.sha: that is the pre-bump commit, with the previous version.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.version }}

      # AGP 9.1 needs JDK 17 or newer; 21 is the JDK every local build of this repo uses.
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}

      - name: Apply keystore
        env:
          KEYSTORE64: ${{ secrets.KEYSTORE64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE64" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::KEYSTORE64/KEY_PASSWORD/KEY_ALIAS must be set"
            exit 1
          fi
          STORE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE64" | base64 --decode > "$STORE"
          # key.properties is a Java properties file: a backslash in a value must be doubled.
          PASS=${KEY_PASSWORD//\\/\\\\}
          ALIAS=${KEY_ALIAS//\\/\\\\}
          for dir in android companion/android; do
            {
              echo "storePassword=$PASS"
              echo "keyPassword=$PASS"
              echo "keyAlias=$ALIAS"
              echo "storeFile=$STORE"
            } > "$dir/key.properties"
          done
          echo "Release signing: using the configured keystore."

      # The tests ran in resolve-version on this same tree; the tag only changes the version lines.
      - name: Get dependencies
        run: |
          flutter pub get
          (cd companion && flutter pub get)

      - name: Build the TV APKs (split ABI)
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64

      - name: Build the companion APK
        working-directory: companion
        run: flutter build apk --release

      - name: Rename
        run: |
          set -euo pipefail
          mkdir dist
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/ilonatv-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/ilonatv-arm64-v8a.apk
          cp companion/build/app/outputs/flutter-apk/app-release.apk dist/ilonatv-companion.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: android-apks
          path: dist/
          if-no-files-found: error
          retention-days: 30

  # Unsigned: the README has the first-run steps for macOS and Windows.
  build-macos:
    needs: resolve-version
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.version }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}

      - name: Build the companion for macOS
        working-directory: companion
        run: |
          flutter pub get
          flutter build macos --release

      - name: Zip
        run: |
          set -euo pipefail
          mkdir dist
          ditto -c -k --keepParent "companion/build/macos/Build/Products/Release/Ilona TV Companion.app" dist/ilonatv-companion-macos.zip

      - name: Upload the app
        uses: actions/upload-artifact@v7
        with:
          name: companion-macos
          path: dist/
          if-no-files-found: error
          retention-days: 30

  build-windows:
    needs: resolve-version
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.version }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}

      - name: Build the companion for Windows
        working-directory: companion
        run: |
          flutter pub get
          flutter build windows --release

      - name: Zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item -Recurse companion/build/windows/x64/runner/Release "Ilona TV Companion"
          Compress-Archive -Path "Ilona TV Companion" -DestinationPath dist/ilonatv-companion-windows.zip

      - name: Upload the app
        uses: actions/upload-artifact@v7
        with:
          name: companion-windows
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [resolve-version, build-android, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download the builds
        uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - name: Checksum
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum ilonatv-armeabi-v7a.apk ilonatv-arm64-v8a.apk ilonatv-companion.apk ilonatv-companion-macos.zip ilonatv-companion-windows.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          # The last published release, not the previous tag: a run that never released still leaves its tag.
          PREV_TAG=$(gh release list --exclude-drafts --limit 1 --json tagName -q '.[0].tagName // empty')
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$TAG" ]; then
            RANGE="$PREV_TAG..$TAG"
          else
            RANGE="-20 $TAG"
          fi
          # shellcheck disable=SC2086
          COMMITS=$(git log $RANGE --pretty=format:"- %s" --no-merges | grep -v '^- chore: bump version' || true)
          EOF_MARKER=$(dd if=/dev/urandom bs=15 count=1 2>/dev/null | base64)
          {
            echo "notes<<${EOF_MARKER}"
            echo "${COMMITS:-- Maintenance release.}"
            echo "${EOF_MARKER}"
          } >> "$GITHUB_OUTPUT"
          echo "$COMMITS"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve-version.outputs.version }}
          name: Ilona TV ${{ needs.resolve-version.outputs.version }}
          body: |
            ## Ilona TV ${{ needs.resolve-version.outputs.version }}

            ### Changes

            ${{ steps.notes.outputs.notes }}

            ---

            ### Downloads

            | For | File |
            |-----|------|
            | TV, 32-bit (most Fire TV) | `ilonatv-armeabi-v7a.apk` |
            | TV, 64-bit | `ilonatv-arm64-v8a.apk` |
            | Companion (Android phone) | `ilonatv-companion.apk` |
            | Companion (Mac) | `ilonatv-companion-macos.zip` |
            | Companion (Windows PC) | `ilonatv-companion-windows.zip` |
            | Checksums | `SHA256SUMS` |

            ### Install

            - **From your phone:** sideload `ilonatv-companion.apk`, open it and choose "Install Ilona TV on a TV". It downloads the right TV APK from this release and checks its SHA-256.
            - **From a Mac or Windows PC:** unzip the companion for your computer and open it. It is not signed, so the first launch needs one extra step: see [the README](https://github.com/${{ github.repository }}#companion-on-a-computer). It installs Ilona TV on a TV the same way, including Google TV through Wireless debugging.
            - **From a computer, by hand:** follow [Get started](https://github.com/${{ github.repository }}#get-started) in the README. `adb shell getprop ro.product.cpu.abilist` says which TV APK to use.
          files: |
            dist/ilonatv-armeabi-v7a.apk
            dist/ilonatv-arm64-v8a.apk
            dist/ilonatv-companion.apk
            dist/ilonatv-companion-macos.zip
            dist/ilonatv-companion-windows.zip
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
