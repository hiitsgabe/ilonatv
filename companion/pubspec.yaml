name: ilonatv_companion
description: Remote control for the IlonaTv launcher.
publish_to: 'none'
version: 0.6.1+10002

environment:
  sdk: ^3.13.2

dependencies:
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  ilonatv_protocol:
    path: ../packages/ilonatv_protocol
  mobile_scanner: ^7.5.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
